
services:
  srp-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: srp-app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:////data/srp.db
    volumes:
      - srp-data:/data
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: srp-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    depends_on:
      - srp-app
    restart: unless-stopped


  grafana:
    image: grafana/grafana-oss:latest
    container_name: srp-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped


volumes:
  srp-data:
    external: true
  prometheus-data:
  grafana-data:
